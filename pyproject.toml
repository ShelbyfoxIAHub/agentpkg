[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpkg"
version = "0.1.0"
description = "Portable semantic packages for local and private AI agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "agentpkg contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]

[project.scripts]
agentpkg = "agentpkg.cli:main"

[project.optional-dependencies]
documents = [
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
include = ["agentpkg*"]
