[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentpkg"
version = "1.0.0"
description = "Estandar y herramientas para empaquetar e indexar conocimiento para IA."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
pdf = ["pypdf"]
docx = ["python-docx"]
xlsx = ["openpyxl"]
all = ["pypdf", "python-docx", "openpyxl", "pytest"]

[project.scripts]
agentpkg = "agentpkg.cli:main"

[tool.setuptools.packages.find]
include = ["agentpkg*"]
